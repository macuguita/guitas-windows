plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    runs {
        datagen {
            client()
            name "Data Generation"

            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_name}"
            vmArg "-Dfabric-api.datagen.output-dir=${project(':common').file("src/main/generated")}"
            runDir "build/datagen"
        }
        client {
            client()
            name "Fabric Client"

            programArgs "--username", "macuguita"
            programArgs "--uuid", "0e56050b-ee27-478a-a345-d2b384919081"
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modCompileOnly "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    //modImplementation "com.macuguita.lib:macu_lib-fabric:${project.macu_lib_version}-${project.minecraft_version}"
    modImplementation "maven.modrinth:macu-lib:${project.macu_lib_version}-${project.minecraft_version}-fabric"
    modApi "com.terraformersmc:modmenu:7.2.2"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'macu_lib_version', project.macu_lib_version

    filesMatching('fabric.mod.json') {
        expand (
                version: project.version,
                macu_lib: project.macu_lib_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}